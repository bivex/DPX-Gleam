[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-gleam"
version = "0.1.0"
description = "Type-Safe Gleam Static Analyzer: OTP Actors, Algebraic Data Types, Railway Monads, GoF 23 & BEAM Concurrency Pattern Detector"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
dpx-gleam = "pattern_detector.adapters.inbound.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/pattern_detector --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/pattern_detector"]
omit = ["tests/*"]
